# Publica br.com.bernisoftware:bfocus no Maven Central ao dar push de uma tag vX.Y.Z no espelho público
# bernisoftware/bfocus-java (o scripts/release-sdks.sh do monorepo espelha clients/java e cria a tag).
#
# PUBLICAR EXIGE SUÍTE VERDE — no piso (Java 11) e no teto (Java 21) suportados, contra a árvore E contra o jar
# que vai subir. No bZapper, versões foram ao registro com envios quebrados porque o workflow ia direto do build
# para o upload.
#
# Secrets (Settings → Secrets and variables → Actions), ambiente `maven-central` — MESMOS nomes do
# bernisoftware/bzapper-java, para um único conjunto (secret da org) servir aos dois produtos:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — token de usuário do Sonatype Central Portal
#       (central.sonatype.com → View Account → Generate User Token), namespace br.com.bernisoftware verificado
#   MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE — chave que assina os artefatos (a pública num keyserver)
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Piso e teto: a SDK compila com --release 11 e roda em qualquer JDK ≥ 11.
  test:
    name: test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Conformidade (cases.json da cópia local) + unitários + versão, contra target/classes.
      - run: mvn -B verify

  # A MESMA suíte roda de novo contra o JAR empacotado (perfil `artifact`: failsafe põe o jar no classpath, e o
  # VersionTest confere que a SDK veio mesmo do .jar) — pega erro de empacotamento. E o exemplo compila contra ele.
  verify-jar:
    name: verify-jar (Java ${{ matrix.java }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -P artifact verify
      - name: O exemplo compila contra o jar
        run: |
          jar="$(ls target/bfocus-*.jar | grep -v -e sources -e javadoc)"
          javac -Xlint:all -Werror -cp "$jar" -d "$RUNNER_TEMP/examples" examples/*.java

  publish:
    needs: verify-jar # sem suíte verde (árvore + jar, Java 11 e 21) não sobe nada
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/br.com.bernisoftware/bfocus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # compila com --release 11 (pom.xml): o bytecode roda no Java 11
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # A tag é a versão publicada. O bump e a tag são passos separados no release-sdks.sh: se divergirem, o
      # Central receberia um número diferente do que a tag promete (e o X-Bfocus-Client mentiria).
      - name: A tag bate com o pom.xml e com Version.java
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          code="$(sed -n 's/.*public static final String VERSION = "\([^"]*\)".*/\1/p' src/main/java/br/com/bernisoftware/bfocus/Version.java)"
          [ "$tag" = "$pom" ] || { echo "::error::tag $GITHUB_REF_NAME != pom.xml $pom"; exit 1; }
          [ "$pom" = "$code" ] || { echo "::error::pom.xml $pom != Version.java $code"; exit 1; }
          echo "versão $pom confirmada"

      # release = sources + javadoc + assinatura GPG + upload ao Central; artifact = a suíte roda contra o jar que
      # está subindo (integration-test/verify vêm antes de deploy).
      - name: Publica no Maven Central
        run: mvn -B -P release,artifact deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
